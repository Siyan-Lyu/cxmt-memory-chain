.migration-row > div { height: 6px; background: #edf1ee; border-radius: 99px; overflow: hidden; }
.migration-row i { display: block; height: 100%; background: var(--emerald); border-radius: inherit; }
.migration-row b { text-align: right; color: var(--muted); font-size: 8px; }
.demand-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 19px; }
.demand-panel > p { margin: 14px 0 0; color: var(--faint); font-size: 8px; line-height: 1.55; }

.company-section {
  padding-bottom: 13px;
}

.company-heading {
  align-items: flex-end;
}

.result-count {
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.result-count strong { color: var(--emerald); font-size: 24px; }
.result-count span { color: var(--faint); font-size: 10px; }

.filter-bar {
  display: grid;
  grid-template-columns: minmax(220px, 1.3fr) repeat(4, minmax(118px, 0.55fr)) 64px;
  gap: 8px;
  padding: 12px;
  background: #f7f9f6;
  border: 1px solid #e7ebe8;
  border-radius: 12px;
}

.filter-search { width: 100%; height: 36px; padding: 0 10px; background: #fff; }
.filter-search span { font-size: 16px; }

.filter-bar select,
.reset-button {
  height: 36px;
  padding: 0 9px;
  outline: 0;
  color: #52605c;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 9px;
  cursor: pointer;
}

.filter-bar select:focus { border-color: rgba(13,124,102,.5); }
.reset-button { color: var(--emerald); font-weight: 700; }
.reset-button:hover { background: var(--emerald-soft); }

.company-table-wrap {
  margin-top: 10px;
  overflow-x: auto;
}

.company-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.company-table th {
  padding: 11px 10px;
  color: #929b98;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-size: 8px;
  font-weight: 750;
  letter-spacing: 0.08em;
}

.company-table th:nth-child(1) { width: 17%; }
.company-table th:nth-child(2) { width: 12%; }
.company-table th:nth-child(3) { width: 27%; }
.company-table th:nth-child(4) { width: 11%; }
.company-table th:nth-child(5) { width: 11%; }
.company-table th:nth-child(6) { width: 7%; }
.company-table th:last-child { width: 4%; }

.company-table td {
  padding: 10px;
  border-bottom: 1px solid #edf0ee;
  vertical-align: middle;
  font-size: 9px;
}

.company-table tbody tr {
  cursor: pointer;
  transition: 150ms ease;
}

.company-table tbody tr:hover {
  background: #f6faf7;
}

.company-name {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
}

.mini-icon {
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  border-radius: 9px;
  font-size: 13px;
}

.company-name > div {
  min-width: 0;
  display: grid;
  gap: 3px;
}

.company-name b { overflow: hidden; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
.company-name small { overflow: hidden; color: var(--faint); font-size: 8px; white-space: nowrap; text-overflow: ellipsis; }

.stage-pill,
.status,
.relation,
.track-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px 7px;
  border-radius: 6px;
  font-size: 8px;
  font-weight: 700;
  white-space: nowrap;
}

.stage-pill { color: #56635f; background: var(--canvas); }
.status { color: #4c5a56; background: #edf1ef; }
.status-IPO进程 { color: #0d715e; background: #daf0e8; }
.status-挂牌进程 { color: #6b5d24; background: #f5efd9; }
.status-上市体系 { color: #5e5b7c; background: #eeecf7; }
.relation { color: #66716e; background: #f0f2f1; }
.relation-官方客户 { color: #08715b; background: #d8f0e8; }
.relation-品类相关 { color: #586f1a; background: #edf5d4; }
.relation-相邻赛道 { color: #5b617c; background: #ebeefa; }
.specialty-cell { display: block; overflow: hidden; color: #515d5a; white-space: nowrap; text-overflow: ellipsis; }
.row-arrow { width: 25px; height: 25px; padding: 0; color: var(--emerald); background: transparent; border: 0; border-radius: 7px; cursor: pointer; }
.company-table tr:hover .row-arrow { background: var(--emerald-soft); }

.empty-state {
  min-height: 220px;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 8px;
  color: var(--muted);
}

.empty-state b { font-size: 13px; }
.empty-state span { font-size: 9px; }
.empty-state button { margin-top: 8px; padding: 7px 12px; color: #fff; background: var(--emerald); border: 0; border-radius: 8px; font-size: 9px; cursor: pointer; }
.mobile-company-list { display: none; }

.competition-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.market-benchmarks {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
  margin-bottom: 10px;
}

.market-benchmarks article {
  min-height: 112px;
  display: flex;
  flex-direction: column;
  padding: 14px;
  background: linear-gradient(145deg, #1a2422, #17201e);
  border: 1px solid #2d3935;
  border-radius: 12px;
}

.market-benchmarks article:nth-child(2) {
  background: linear-gradient(145deg, #126f5e, #0d7c66);
  border-color: #16836e;
}

.market-benchmarks span {
  color: #aebbb6;
  font-size: 8px;
  font-weight: 700;
}

.market-benchmarks strong {
  margin-top: 9px;
  color: var(--lime);
  font-size: 19px;
  line-height: 1;
  letter-spacing: -0.04em;
}

.market-benchmarks p {
  margin: auto 0 0;
  padding-top: 10px;
  color: #8f9e99;
  font-size: 7.5px;
  line-height: 1.45;
}

.market-benchmarks article:nth-child(2) span,
.market-benchmarks article:nth-child(2) p {
  color: #c9e0da;
}

.competition-grid article {
  position: relative;
  overflow: hidden;
  padding: 16px;
  background: #f8faf7;
  border: 1px solid #e6ebe7;
  border-radius: 12px;
}

.competition-grid article::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 38px;
  height: 3px;
  background: var(--emerald);
}

.competition-grid h3 { margin: 0 0 13px; font-size: 12px; }
.competition-grid dl { margin: 0; display: grid; gap: 9px; }
.competition-grid dl > div { display: grid; grid-template-columns: 54px 1fr; gap: 7px; }
.competition-grid dt { color: #98a19e; font-size: 8px; }
.competition-grid dd { margin: 0; color: #4e5a57; font-size: 8px; line-height: 1.55; }
.competition-grid .private-row dd { color: var(--emerald); font-weight: 700; }
.competition-grid .bottleneck-row { margin-top: 3px; padding-top: 8px; border-top: 1px solid #e4e9e6; }
.competition-grid .bottleneck-row dd { color: #75672f; }

.funding-layout {
  display: grid;
  grid-template-columns: minmax(0, 2.2fr) minmax(260px, .78fr);
  gap: 14px;
}

.timeline {
  position: relative;
  display: grid;
}

.timeline::before {
  content: "";
  position: absolute;
  top: 18px;
  bottom: 18px;
  left: 53px;
  width: 1px;
  background: var(--border);
}

.timeline a {
  position: relative;
  z-index: 1;
  min-height: 48px;
  display: grid;
  grid-template-columns: 39px 13px 1fr 54px 14px;
  align-items: center;
  gap: 8px;
  padding: 5px 7px;
  border-bottom: 1px solid #eef1ef;
  transition: 160ms ease;
}

.timeline a:hover { padding-left: 12px; background: #f7faf7; }
.timeline-year { color: var(--muted); font-size: 9px; font-weight: 700; }
.timeline a > i { width: 9px; height: 9px; display: block; background: #fff; border: 2px solid var(--emerald); border-radius: 50%; }
.timeline-copy { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.timeline-copy b { font-size: 10px; }
.timeline-copy small { overflow: hidden; color: var(--muted); font-size: 9px; white-space: nowrap; text-overflow: ellipsis; }
.timeline-stage { color: var(--emerald); background: var(--emerald-soft); border-radius: 5px; padding: 4px 6px; text-align: center; font-size: 8px; font-weight: 700; }

.evidence-rule {
  display: grid;
  grid-template-columns: 33px 1fr;
  gap: 12px;
  padding: 15px 0;
  border-bottom: 1px solid #edf0ee;
}

.evidence-rule .evidence { width: 30px; height: 30px; border-radius: 9px; font-size: 11px; }
.evidence-rule b { font-size: 10px; }
.evidence-rule p { margin: 4px 0 0; color: var(--muted); font-size: 8px; line-height: 1.55; }
.method-warning { margin-top: 18px; padding: 14px; background: var(--gold-soft); border: 1px solid #eadfb7; border-radius: 11px; }
.method-warning b { color: #76641f; font-size: 10px; }
.method-warning p { margin: 6px 0 0; color: #746b4a; font-size: 8px; line-height: 1.6; }

.moat-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.moat-grid article {
  min-height: 137px;
  padding: 14px;
  border: 1px solid #e4e9e6;
  border-radius: 12px;
  background: #fafbf9;
}

.moat-top { display: flex; align-items: center; justify-content: space-between; }
.moat-top span { width: 33px; height: 33px; display: grid; place-items: center; border-radius: 9px; font-weight: 800; }
.moat-top small { color: #abb2b0; font-size: 8px; font-weight: 800; }
.moat-grid h3 { margin: 13px 0 7px; font-size: 11px; }
.moat-grid p { margin: 0; color: var(--muted); font-size: 8px; line-height: 1.55; }

.memory-moat {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 22px;
  margin-top: 12px;
  padding: 21px;
  color: #eaf3ef;
  background:
    radial-gradient(circle at 90% 15%, rgba(185,217,92,.16), transparent 25%),
    var(--ink);
  border-radius: 13px;
}

.memory-title { display: flex; flex-direction: column; justify-content: center; }
.memory-title span { width: max-content; padding: 5px 8px; color: var(--lime); background: rgba(185,217,92,.08); border: 1px solid rgba(185,217,92,.22); border-radius: 6px; font-size: 8px; font-weight: 800; letter-spacing: .14em; }
.memory-title h3 { margin: 10px 0 0; font-size: 17px; letter-spacing: -.03em; }
.memory-points { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
.memory-points div { padding-left: 13px; border-left: 1px solid #3b4844; }
.memory-points b { color: var(--lime); font-size: 9px; }
.memory-points p { margin: 7px 0 0; color: #aebbb6; font-size: 8px; line-height: 1.65; }

.insights-section {
  padding: 25px 1px 0;
}

.insights-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.insights-grid article {
  min-height: 222px;
  display: flex;
  flex-direction: column;
  padding: 19px;
  background: rgba(255,255,255,.82);
  border: 1px solid var(--border);
  border-radius: 13px;
}

.insights-grid article > span { color: var(--emerald); font-size: 10px; font-weight: 800; }
.insights-grid h3 { margin: 17px 0 10px; font-size: 12px; line-height: 1.55; }
.insights-grid p { margin: 0; color: var(--muted); font-size: 9px; line-height: 1.7; }
.insights-grid small { margin-top: auto; padding-top: 15px; color: #65791d; border-top: 1px solid #edf0ee; font-size: 8px; font-weight: 700; line-height: 1.5; }
.risk-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 10px; padding: 12px 14px; color: #bfc9c5; background: var(--ink); border-radius: 11px; font-size: 8px; }
.risk-strip b { margin-right: 6px; color: var(--lime); font-size: 9px; }
.risk-strip span { padding: 4px 7px; border: 1px solid #3a4743; border-radius: 6px; }

.source-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
}

.source-grid a {
  min-height: 145px;
  display: flex;
  flex-direction: column;
  padding: 15px;
  background: #f8faf7;
  border: 1px solid #e5eae7;
  border-radius: 11px;
  transition: 180ms ease;
}

.source-grid a:hover { transform: translateY(-2px); border-color: rgba(13,124,102,.28); box-shadow: 0 12px 24px rgba(24,32,31,.07); }
.source-grid a > span { color: var(--emerald); font-size: 8px; font-weight: 800; letter-spacing: .1em; }
.source-grid h3 { margin: 10px 0 6px; font-size: 10px; line-height: 1.45; }
.source-grid p { margin: 0; color: var(--muted); font-size: 8px; line-height: 1.55; }
.source-grid b { margin-top: auto; padding-top: 12px; color: var(--emerald); font-size: 8px; }
.methodology-note { display: grid; grid-template-columns: 85px 1fr; gap: 15px; margin-top: 12px; padding: 14px; color: #596561; background: var(--emerald-soft); border-radius: 10px; }
.methodology-note b { color: var(--emerald); font-size: 10px; }
.methodology-note p { margin: 0; font-size: 8px; line-height: 1.65; }

footer {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 25px;
  padding: 25px 2px 0;
  color: var(--faint);
  font-size: 8px;
}

footer > div { display: grid; gap: 5px; }
footer b { color: var(--ink); font-size: 10px; }
footer p { max-width: 460px; margin: 0; text-align: right; line-height: 1.5; }

.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  justify-content: flex-end;
  background: rgba(18,25,23,.48);
  backdrop-filter: blur(4px);
  animation: fadeIn 160ms ease-out;
}

.company-drawer {
  width: min(520px, 94vw);
  height: 100%;
  position: relative;
  overflow-y: auto;
  padding: 32px 31px 28px;
  background: #fbfcfa;
  box-shadow: -25px 0 60px rgba(10,20,17,.22);
  animation: slideIn 220ms ease-out;
}

.drawer-close {
  position: absolute;
  top: 19px;
  right: 19px;
  width: 32px;
  height: 32px;
  padding: 0;
  color: var(--muted);
  background: var(--canvas);
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 18px;
  cursor: pointer;
}

.drawer-close:hover { color: var(--ink); background: #fff; }
.drawer-hero { display: flex; align-items: center; gap: 15px; padding-right: 37px; }
.drawer-icon { width: 55px; height: 55px; flex: 0 0 55px; display: grid; place-items: center; border-radius: 16px; font-size: 22px; font-weight: 800; }
.drawer-hero p { margin: 0 0 4px; color: var(--emerald); font-size: 8px; font-weight: 750; letter-spacing: .06em; }
.drawer-hero h2 { margin: 0; font-size: 25px; letter-spacing: -.04em; }
.drawer-hero > div > span { display: block; margin-top: 3px; color: var(--faint); font-size: 9px; }
.drawer-tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 22px 0 8px; }
.drawer-tags .evidence { width: auto; padding-inline: 8px; }
.track-tag { color: #4e5d59; background: #e9eeeb; }
.company-drawer section { margin-top: 18px; padding: 18px; background: #fff; border: 1px solid var(--border); border-radius: 12px; }
.company-drawer section small { color: var(--emerald); font-size: 8px; font-weight: 800; letter-spacing: .09em; }
.company-drawer section h3 { margin: 8px 0 6px; font-size: 13px; }
.company-drawer section p { margin: 8px 0 0; color: #53605c; font-size: 10px; line-height: 1.75; }
.company-drawer .drawer-funding { background: #f4f8e8; border-color: #e1e9c6; }
.company-drawer .drawer-relation { background: #eef7f3; border-color: #d6e9e2; }
.drawer-tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 17px; }
.drawer-tag-list span { padding: 5px 8px; color: var(--muted); background: #edf1ef; border-radius: 6px; font-size: 8px; }
.drawer-source { min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 18px; padding: 12px 14px; color: #fff; background: var(--ink); border-radius: 11px; }
.drawer-source span { display: grid; gap: 4px; }
.drawer-source small { color: #99aaa4; font-size: 8px; }
.drawer-source b { font-size: 10px; }
.drawer-source strong { color: var(--lime); font-size: 9px; }
.drawer-disclaimer { margin: 17px 2px 0; color: var(--faint); font-size: 8px; line-height: 1.6; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideIn { from { transform: translateX(30px); opacity: .6; } to { transform: translateX(0); opacity: 1; } }

@media (max-width: 1180px) {
  .main-canvas { padding-inline: 25px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .overview-grid, .split-grid, .funding-layout { grid-template-columns: 1fr; }
  .watch-list { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 12px; }
  .competition-grid, .market-benchmarks, .moat-grid, .insights-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .memory-moat { grid-template-columns: 1fr; }
  .memory-points { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .filter-bar { grid-template-columns: minmax(200px, 1.2fr) repeat(2, minmax(120px,.65fr)); }
  .reset-button { grid-column: auto; }
  .source-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

@media (max-width: 900px) {
  .side-rail { display: none; }
  .main-canvas { width: 100%; margin-left: 0; padding: 24px 18px 42px; }
  .topbar { flex-direction: column; gap: 16px; }
  .header-actions { width: 100%; padding-top: 0; }
  .global-search { flex: 1; width: auto; }
  .mobile-nav { position: sticky; top: 7px; z-index: 25; display: flex; gap: 4px; margin: 0 0 13px; padding: 5px; overflow-x: auto; background: rgba(24,32,31,.92); border-radius: 12px; backdrop-filter: blur(10px); }
  .mobile-nav button { flex: 1 0 auto; padding: 8px 11px; color: #c9d3cf; background: transparent; border: 0; border-radius: 8px; font-size: 9px; }
  .mobile-nav button:hover { color: var(--lime); background: rgba(255,255,255,.07); }
  .chain-graph { grid-template-columns: minmax(180px,1fr) minmax(190px,.8fr) minmax(190px,1fr); gap: 19px; overflow-x: auto; }
  .company-table { min-width: 850px; }
}

@media (max-width: 680px) {
  .main-canvas { padding: 18px 12px 34px; }
  .title-lockup h1 { font-size: 27px; }
  .subtitle { font-size: 12px; }
  .header-actions { align-items: stretch; flex-direction: column; }
  .date-chip { width: max-content; }
  .kpi-grid { gap: 8px; }
  .kpi-card { min-height: 104px; grid-template-columns: 36px 1fr; gap: 10px; padding: 14px 13px; }
  .kpi-icon { width: 36px; height: 36px; border-radius: 10px; font-size: 15px; }
  .kpi-card strong { font-size: 22px; }
  .kpi-card span { font-size: 9px; }
  .kpi-card small { margin-top: -18px; font-size: 7px; }

  .section-heading h2 { font-size: 17px; }
  .chain-graph { min-height: auto; display: flex; flex-direction: column; gap: 12px; padding: 36px 10px 13px; overflow: visible; }
  .chain-graph::before, .chain-graph::after { display: none; }
  .graph-label { display: none; }
  .stage-stack { width: 100%; }
  .upstream-stack, .downstream-stack { grid-template-columns: 1fr; }
  .cxmt-anchor { width: 100%; min-height: 245px; order: 2; }
  .upstream-stack { order: 1; }
  .downstream-stack { order: 3; }
  .cxmt-anchor > button { width: 180px; min-height: 185px; }
  .orbit-one { width: 220px; height: 220px; }
  .orbit-two { display: none; }
  .anchor-stat { right: calc(50% - 128px); bottom: 3px; }
  .watch-list { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 83px 1fr 71px; gap: 8px; }
  .bar-meta span { display: none; }
  .procurement-footnotes { align-items: flex-start; flex-direction: column; }
  .competition-grid, .market-benchmarks, .moat-grid, .insights-grid, .source-grid { grid-template-columns: 1fr; }
  .insights-grid article { min-height: 190px; }
  .memory-points { grid-template-columns: 1fr; }
  .memory-points div { padding: 0 0 12px; border-left: 0; border-bottom: 1px solid #34413d; }
  .filter-bar { grid-template-columns: 1fr 1fr; }
  .filter-search { grid-column: 1 / -1; }
  .reset-button { grid-column: 2; }
  .company-table-wrap { display: none; }
  .mobile-company-list { display: grid; gap: 8px; margin-top: 10px; }
  .mobile-company-list > button { padding: 13px; text-align: left; background: #fbfcfa; border: 1px solid #e5eae7; border-radius: 11px; }
  .mobile-card-top { display: flex; align-items: center; gap: 7px; }
  .mobile-card-top .evidence { margin-left: auto; }
  .mobile-company-list > button > b { display: block; margin-top: 11px; font-size: 13px; }
  .mobile-company-list > button > p { margin: 6px 0 11px; color: var(--muted); font-size: 9px; line-height: 1.5; }

.bi-select-options { position: absolute; top: calc(100% + 6px); left: 0; min-width: 260px; width: max(100%,260px); max-height: 440px; overflow-y: auto; padding: 5px; border: 1px solid var(--border-strong); background: white; border-radius: 10px; box-shadow: var(--shadow-hover); z-index: 40; }

.bi-select-option[aria-selected="true"], .bi-select-option:focus, .bi-select-option:hover { background: var(--emerald-soft); outline: 0; }
.company-table { min-width: 1200px; table-layout: auto; }
.company-table td { padding: 18px 12px; font-size: 1rem; vertical-align: top; }
.company-table th { font-size: .9375rem; }
.company-name b, .specialty-cell { white-space: normal; overflow: visible; text-overflow: clip; }
.company-name { align-items: flex-start; }
.company-name small { display: none; }
.status-pill, .stage-pill, .relation-pill { height: auto; max-width: 220px; white-space: normal; padding: 7px 9px; }
.table-scroll, .company-table-wrap, .academy-table-wrap, .classroom-table-wrap { overflow-x: auto; }
.competition-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
.timeline-copy { display: grid; align-items: start; gap: 8px; }
.timeline-copy small { white-space: normal; overflow: visible; text-overflow: clip; }
.timeline a { grid-template-columns: 39px 13px minmax(0,1fr) max-content 14px; min-height: 110px; padding-block: 16px; align-items: start; }
.timeline-stage { display: inline-grid; width: max-content; max-width: 12rem; min-width: 0; padding: 8px 12px; justify-self: end; white-space: normal; }
.timeline-stage .bi { font-size: .9375rem !important; }
.source-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
.insights-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
.company-drawer { width: min(650px, 100%); padding: 28px; }
.company-drawer h2 { font-size: 1.8rem; }
.company-drawer section p { font-size: 1rem; line-height: 1.75; }
.drawer-source { align-items: flex-start; flex-wrap: wrap; }
.bi-snapshot-note { margin: 16px 0; padding: 14px 18px; color: #4e635b; background: #eef5f0; border-left: 3px solid var(--emerald); border-radius: 0 8px 8px 0; }
.live-panel { margin: 24px 0; padding: 28px; border: 1px solid var(--border); border-top: 4px solid var(--emerald); border-radius: 16px; background: white; }
.live-panel-head { display: flex; align-items: start; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.live-panel h2 { margin: 0; }
.live-panel p { margin: 12px 0; color: var(--muted); }
.live-status { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 14px 0; padding: 12px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.live-status .bi { font-size: .875rem !important; }
.live-refresh { padding: 10px 14px; background: var(--emerald-soft); color: var(--emerald-dark); border: 1px solid var(--border-strong); border-radius: 9px; cursor: pointer; }
.live-warning { color: #826222 !important; background: #fff8e7; padding: 12px; border-radius: 8px; }
.live-metrics { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin: 20px 0; }
.live-metric { display: flex; flex-direction: column; gap: 12px; padding: 18px; border: 1px solid var(--border); border-radius: 12px; background: #f8fbf8; }
.live-metric-value { font-size: 1.65rem; color: var(--emerald-dark); font-weight: 800; overflow-wrap: anywhere; }
.live-metric .bi { font-size: 1rem !important; }
.live-metric-source { margin-top: auto; color: var(--emerald-dark); text-decoration: underline; text-underline-offset: 4px; }
.live-news-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
.live-news-card { display: flex; flex-direction: column; gap: 8px; padding: 20px; border: 1px solid var(--border); border-radius: 12px; }
.live-news-card h3 { margin: 0; }
.live-news-card p { margin: 0; }
.live-news-card a { color: var(--emerald); text-decoration: underline; text-underline-offset: 4px; margin-top: auto; }
.live-date { color: var(--muted); font-size: .875rem; }
.live-policy { margin-top: 20px; }
.live-policy summary { cursor: pointer; padding: 8px 0; color: var(--emerald); }
.live-policy li { margin: 8px 0 8px 24px; }
.live-check-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.live-check-table td, .live-check-table th { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.live-check-table a { color: var(--emerald); text-decoration: underline; }
.live-check-table time { font-size: .875rem; white-space: nowrap; }
@media(max-width:1400px) {
  .filter-bar { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .filter-search { grid-column: span 2; }
  .overview-grid { grid-template-columns: 1fr; }
  .watch-panel { display: none; }
  .live-metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@media(max-width:1000px) {
  .main-canvas { margin-left: 0; width: 100%; }
  .side-rail { display: none; }
  .mobile-nav { display: flex; flex-wrap: wrap; }
  .mobile-nav button { min-height: 66px; }
  .academy-opening, .split-grid { grid-template-columns: 1fr; }
  .video-learning-layout { grid-template-columns: 1fr; }
  .playlist-items { grid-template-columns: repeat(2,minmax(0,1fr)); max-height: none; overflow: visible; }
  .source-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .journey-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .chain-graph { display: flex; flex-direction: column; }
  .chain-graph { padding-top: 24px; }
  .graph-label { position: static; max-width: 100%; }
  .downstream-label { order: 3; }
  .downstream-stack { order: 4; }
  .cxmt-anchor { order: 2; }
  .upstream-stack { order: 1; }
  .chain-graph::before, .chain-graph::after { display: none; }
  .stage-stack { width: 100%; }
  .cxmt-anchor { width: 100%; min-height: 310px; }
  .cxmt-anchor > button { max-width: 450px; min-height: 300px; }
  .academy-unit-heading { gap: 12px; }
}
@media(max-width:680px) {
  .main-canvas { padding: 16px 12px 40px; }
  .title-lockup { flex-basis: 100%; }
  .header-actions { width: 100%; }
  .global-search { width: 100%; }
  .kpi-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .kpi-card { grid-template-columns: minmax(0,1fr); padding: 15px 12px; }
  .kpi-card .bi { font-size: .9375rem !important; }
  .kpi-icon { display: none; }
  .kpi-card > small { grid-column: 1; }
  .competition-grid dl > div { grid-template-columns: 1fr; }
  .panel, .academy-section, .classroom-section { padding: 20px 14px; }
  .academy-opening { grid-template-columns: 1fr; }
  .beginner-explainer, .dram-cell-card { padding: 18px 14px; }
  .dram-cell-visual { grid-template-columns: 70px 110px 80px; gap: 8px; min-height: 310px; }
  .transistor { width: 110px; }
  .foundation-grid, .source-grid, .competition-grid, .insights-grid { grid-template-columns: 1fr; }
  .classroom-tabs { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .playlist-items { grid-template-columns: 1fr; }
  .stage-node { grid-template-columns: 24px 34px minmax(0,1fr) 28px; padding: 12px 10px; gap: 7px; }
  .node-icon { width: 34px; height: 34px; font-size: 18px; }
  .live-panel { padding: 20px 14px; }
  .live-metrics, .live-news-grid { grid-template-columns: 1fr; }
  .live-metric-value { font-size: 1.5rem; }
  .filter-bar { grid-template-columns: repeat(2,minmax(0,1fr)); padding: 10px; }
  .filter-search { grid-column: span 2; }
  .bi-select-options { min-width: 0; width: 100%; max-height: 360px; }
  .bi-select .bi { font-size: .875rem !important; }
  .reset-button { grid-column: span 2; min-height: 65px; }
  .bar-row { grid-template-columns: 125px minmax(25px,1fr) 90px; gap: 6px; }
  .bar-row .bi { font-size: .875rem !important; }
  .migration-row { grid-template-columns: 110px 1fr 92px; }
  .timeline a { grid-template-columns: 42px 10px minmax(0,1fr); }
  .timeline a > .arrow { display: none; }
  .timeline-stage { grid-column: 3; grid-row: 2; justify-self: start; max-width: 100%; }
  .timeline-copy { min-width: 0; }
  .company-drawer { padding: 24px 18px; }
  .live-check-table { min-width: 640px; }
  footer { flex-direction: column; align-items: flex-start; }
  footer p { text-align: left; }
}
@media print { .side-rail, .mobile-nav, .live-refresh { display: none; } .main-canvas { margin-left: 0; } .bi { break-inside: avoid; } .live-panel { break-inside: avoid; } }

ions and purchasing scale","晶圆 Wafer":"Wafer","一张圆形高纯硅片，主流先进产线直径约 300mm。工厂会在上面同时制造数百颗芯片。":"A circular, high-purity silicon substrate. Leading production lines generally use 300 mm wafers, on which hundreds of chips are fabricated together.","它是加工中的大底板，不是一颗可以直接使用的芯片。":"It is the large substrate being processed, rather than a chip ready for use.","裸片 Die":"Die","晶圆加工完成后，被切割成一小块一小块电路；每一小块就是裸片。":"After wafer processing, the circuits are cut into small pieces. Each piece is a die.","裸片很脆，通常还没有适合用户设备连接的引脚。":"A die is fragile and usually does not yet have the connections needed for installation in a device.","封装芯片 Package":"Packaged chip","把裸片固定、接出电信号并保护起来，变成可以焊到电路板上的黑色芯片。":"The die is mounted, connected electrically and protected, creating a chip that can be soldered onto a circuit board.","封装会影响散热、信号速度和可靠性，不只是套一个外壳。":"Packaging affects heat dissipation, signal speed and reliability; it does more than add a protective case.","模组 Module":"Module","把多颗封装芯片、电路板及辅助器件组合成内存条、SSD 或嵌入式存储产品。":"Several packaged chips, a circuit board and supporting components are assembled into a memory module, SSD or embedded-storage product.","内存条通常使用 DRAM；SSD 主要使用 NAND，两者不是同一种存储。":"Memory modules usually use DRAM; SSDs mainly use NAND. They are different types of memory.","断电丢失":"Data is lost without power","最快":"Fastest","约 6 个晶体管存 1 bit":"About six transistors store one bit","CPU / GPU 高速缓存":"CPU / GPU caches","很快但面积大、价格高，适合离计算核心最近的位置。":"Very fast, but large and expensive per bit; best placed close to the computing cores.","快":"Fast","1 个晶体管 + 1 个电容":"One transistor and one capacitor","服务器、PC、手机运行内存":"Working memory in servers, PCs and phones","长鑫的主战场：成本与速度平衡好，但电容漏电，所以必须不断刷新。":"CXMT's main market: a good balance of cost and speed. Its capacitors leak charge, so the stored data needs regular refreshing.","断电保留":"Data survives without power","中等":"Medium","浮栅 / 电荷俘获单元":"Floating-gate / charge-trap cell","SSD、手机容量存储、U 盘":"SSDs, phone storage and USB drives","容量大、适合长期保存；按页写入、按块擦除，离不开主控和纠错算法。":"High capacity for long-term storage. Data is written by page and erased by block, requiring controllers and error correction.","随机读取快":"Fast random reads","可直接寻址的存储阵列":"Directly addressable memory array","启动代码、固件、车规芯片":"Boot code, firmware and automotive chips","容量通常不大，但可以直接读取代码，适合放设备启动程序。":"Usually lower in capacity, but permits direct code reads; useful for a device's startup program.","路线仍在演进":"Technology is still evolving","电阻 / 相变状态":"Resistance / phase-change states","新型存储、存算一体探索":"Emerging memory and computing-in-memory research","不是 DRAM 的简单升级，而是利用新物理机制保存信息的新路线。":"Uses different physical mechanisms to store information; it is a distinct approach rather than a simple DRAM upgrade.","服务器、台式机、笔记本":"Servers, desktops and laptops","更高容量、带宽和可靠性":"Higher capacity, bandwidth and reliability","常做成 DIMM / SODIMM 内存条":"Often supplied as DIMM / SODIMM memory modules","手机、平板、轻薄设备":"Phones, tablets and thin devices","更低功耗、更小体积":"Lower power consumption and smaller size","LP = Low Power，常直接焊在主板上":"LP means Low Power; chips are often soldered directly onto the motherboard","AI 加速器、高性能计算":"AI accelerators and high-performance computing","极高带宽、低单位传输功耗":"Extremely high bandwidth and low energy per transfer","多层 DRAM 通过 TSV 堆叠，依赖 2.5D / 3D 封装":"Multiple DRAM layers are stacked using through-silicon vias (TSVs), relying on 2.5D / 3D packaging","显卡、游戏机、图形计算":"Graphics cards, consoles and graphics computing","高带宽与成本平衡":"A balance of high bandwidth and cost","服务图形处理，不等于 HBM":"Designed for graphics workloads; distinct from HBM","芯片入门":"Chip basics","小学生都能看懂的芯片工作原理":"How a chip works: a beginner-friendly explanation","先建立晶体管、逻辑门和芯片如何执行工作的直观印象。":"Start with an intuitive view of transistors, logic gates and how a chip performs work.","对应：零基础第 1 课的前置知识":"Related course: preparation for beginner lesson 1","内存原理":"How memory works","用动画讲解内存的原理":"How memory works, explained with animation","通过动画理解数据怎样进入内存，以及地址、读取和写入在做什么。":"See how data enters memory and what addresses, reading and writing actually do.","对应：DRAM 的 0 / 1 与读写原理":"Related course: DRAM bits and read/write operations","缓存和内存是什么？DRAM 与 SRAM 的区别":"What are cache and main memory? DRAM versus SRAM","解释为什么 CPU 缓存很快、运行内存容量更大，以及两类存储单元如何保存信息。":"Understand why CPU caches are fast, why main memory has greater capacity and how each type of cell stores data.","对应：零基础第 3 课的存储类型对照":"Related course: the memory comparison in beginner lesson 3","同样是 Flash，为什么 NAND 比 NOR 更获资本关注？":"Both are Flash: why does NAND attract more investment than NOR?","从读写方式、容量、成本和应用场景理解 NAND 与 NOR 的根本区别，并认识 AI 时代存储需求的变化。":"Compare NAND and NOR through access methods, capacity, cost and applications, then explore changing memory demand in the AI era.","对应：零基础第 3 课与存储制造技术课":"Related courses: beginner lesson 3 and memory fabrication","内存产品":"Memory products","LPDDR5、DDR5、GDDR6 都有什么区别？":"How do LPDDR5, DDR5 and GDDR6 differ?","把服务器、PC、手机和显卡使用的内存产品放进真实设备场景中比较。":"Compare the memory used by servers, PCs, phones and graphics cards in real devices.","对应：零基础第 4 课的 DRAM 家族":"Related course: the DRAM family in beginner lesson 4","晶圆制造":"Wafer manufacturing","如何用沙子制造芯片：从硅锭到晶圆":"Making chips from sand: from silicon ingot to wafer","直观看到硅原料如何提纯、拉晶、切片并打磨成晶圆。":"Watch how silicon is purified, grown into crystals, sliced and polished into wafers.","对应：半导体材料与存储制造环节":"Related stages: semiconductor materials and memory fabrication","EDA 设计":"EDA design","如何靠写代码设计百亿晶体管的芯片？":"How can code help design a chip with billions of transistors?","理解人不可能手动画完复杂芯片，EDA 如何帮助设计、验证和物理实现。":"Complex chips cannot be drawn entirely by hand. Learn how electronic design automation (EDA) supports design, verification and physical implementation.","对应：第 01 环 EDA / IP 技术课":"Related course: stage 01, EDA / IP","长鑫专题":"CXMT in focus","长鑫科技与国产 DRAM 的追赶历程":"CXMT and the development of China's DRAM industry","在掌握技术基础后，再理解长鑫的产业位置、投入周期和全球竞争背景。":"After learning the basics, understand CXMT's role, long investment cycle and global competitive environment.","对应：存储制造、竞争格局与公司分析":"Related topics: fabrication, competition and company analysis","先在电脑里把芯片设计对":"Get the chip design right on a computer first","像建筑师用 CAD 画图，再做结构验算；EDA 是芯片工程师的设计、仿真和检查工具，IP 是可以复用的功能模块。":"Like an architect drawing plans and checking structures with CAD, EDA helps chip engineers design, simulate and check circuits. IP is reusable functional circuitry.","把容量、速度、功耗等产品要求变成电路和版图，并在投产前尽可能找出错误。一次流片成本很高，设计阶段漏掉的问题会直接变成制造损失。":"Turn capacity, speed and power requirements into circuits and layouts, finding errors before fabrication. A chip fabrication trial is expensive, so design errors become manufacturing losses.","产品规格 + 工艺厂给出的设计规则":"Product specifications and the foundry's design rules","通过验证的版图数据 + 制造掩模所需数据":"Verified layout data and data needed to create manufacturing masks","定义容量、接口和功耗":"Define capacity, interfaces and power requirements","设计电路与存储阵列":"Design circuits and memory arrays","仿真、形式验证与可测性设计":"Run simulation, formal verification and design-for-test checks","物理实现、签核并交给晶圆厂":"Complete physical implementation and sign-off, then send the design to the fab","仿真":"Simulation","用软件模拟电路在不同输入、温度和电压下是否按预期工作。":"Use software to check whether a circuit works as intended under different inputs, temperatures and voltages.","形式验证":"Formal verification","用数学方法证明两份设计是否等价，或某类错误永远不会发生。":"Use mathematical methods to prove that designs are equivalent or that particular errors cannot occur.","性能 Performance、功耗 Power、面积 Area 的综合权衡。":"A trade-off between Performance, Power and Area (PPA).","信号完整性 / 电源完整性，检查高速信号和供电是否稳定。":"Signal integrity / power integrity: checking the stability of high-speed signals and power delivery.","难点不只是写软件，而是底层算法、海量计算性能、先进工艺规则、真实项目验证和客户多年形成的使用习惯。":"The challenges go beyond writing software: core algorithms, huge computations, advanced-process rules, real-project validation and customer habits built over many years.","合见工软":"UniVista","覆盖验证、数字实现、系统协同与先进封装的 EDA 平台":"An EDA platform for verification, digital implementation, system co-design and advanced packaging","大规模仿真、硬件验证、实现与系统级工具链":"Large-scale simulation, hardware verification, implementation and system-level tools","覆盖面更广，目标是平台型工具链。":"Broader coverage, aiming to provide a platform-wide toolchain.","芯华章":"X-Epic","重点解决复杂数字芯片能否被充分验证":"Focuses on thoroughly verifying complex digital chips","软件仿真、形式验证、调试与原型验证":"Software simulation, formal verification, debugging and prototyping","更聚焦数字验证，不等于完整的设计到制造平台。":"More focused on digital verification than on an entire design-to-manufacturing platform.","芯和半导体":"Xpeedic","检查芯片—封装—电路板之间的电磁与信号问题":"Checks electromagnetic and signal behavior across chips, packages and circuit boards","电磁、射频、SI / PI 与 3DIC 仿真":"Electromagnetic, radio-frequency, signal/power-integrity and 3DIC simulation","偏物理和系统协同，与数字逻辑验证解决的问题不同。":"Focuses on physical and system co-design, solving different problems from digital-logic verification.","芯愿景":"Chiponeer","芯片分析、IP 与工程技术服务":"Chip analysis, IP and engineering services","电路提取、芯片分析与设计服务":"Circuit extraction, chip analysis and design services","更接近分析和工程服务，不是通用全流程 EDA 平台。":"Closer to analysis and engineering services than to a general-purpose, full-flow EDA platform.","工具实际覆盖设计流程的哪一步":"Which specific design steps the tools cover","先进工艺项目是否量产验证":"Whether advanced-process projects have been validated in volume production","性能与国际工具差距":"Performance gaps versus international tools","客户续费、扩模块和迁移成本":"Customer renewals, additional modules and switching costs","用超精密机器把图形做进晶圆":"Use ultra-precise machines to build patterns on wafers","像一座纳米级印刷厂：光刻负责印图，刻蚀负责雕刻，沉积负责镀膜，量检测负责检查。每台设备只完成特定工序。":"Think of a nanoscale printing plant: lithography prints, etching carves, deposition adds films, and metrology and inspection check the results. Each tool performs a particular step.","在洁净室内重复执行曝光、刻蚀、薄膜、掺杂、清洗、抛光和检查，让设计图逐层变成真实的晶体管、电容和金属连线。":"Repeat exposure, etching, deposition, doping, cleaning, polishing and inspection in a cleanroom, turning the layout into transistors, capacitors and metal connections layer by layer.","裸硅片 + 掩模版 + 化学材料 + 工艺配方":"Bare silicon wafers, masks, chemicals and process recipes","完成某一道纳米级工序、可进入下一站的晶圆":"A wafer that has completed a particular nanoscale process and can proceed to the next step","光刻把图案转移到光刻胶":"Transfer a pattern into photoresist through lithography","刻蚀 / 沉积 / 注入改变材料结构":"Change material structures through etching, deposition and implantation","CMP 把表面磨平后继续叠层":"Use CMP to flatten the surface before building more layers","量测缺陷、线宽和套刻偏差并反馈调参":"Measure defects, linewidth and alignment errors, then adjust the process","Critical Dimension，关键线宽；偏差几个纳米就可能影响电路。":"Critical Dimension (CD): the width of a key feature; a few nanometers of error can affect circuit behavior.","上下两层图案是否准确对齐，类似多色印刷套色精度。":"Whether patterns on successive layers align accurately, like the registration of colors in printing.","单位时间能处理多少片晶圆，决定设备是否适合量产。":"The number of wafers processed per unit of time, determining suitability for volume production.","设备保持可生产状态的时间比例；再精密的机器频繁停机也难量产。":"The percentage of time a tool is ready for production; even a precise machine is unsuitable if it frequently stops.","核心是纳米精度、机电光算法协同、设备稳定运行、与客户工艺共同调试，以及大量故障和缺陷数据形成的经验。":"The barriers include nanoscale precision, coordinated mechanics, optics and algorithms, stable operation, joint process tuning with customers and experience gained from defect data.","这些公司大多处于不同工序，并不是一组直接竞争者；比较前要先确认它们解决的是哪道工序。":"Most of these companies serve different process steps and are not direct competitors. Establish the step each company addresses before comparing them.","上海微电子":"SMEE","用光把掩模版图案投影到涂胶晶圆上":"Projects photomask patterns onto photoresist-coated wafers using light","光刻系统、精密运动台与曝光控制":"Lithography systems, precision motion stages and exposure control","属于图形转移设备；与检测或注入设备不是同类产品。":"A pattern-transfer tool, serving a different purpose from inspection or ion implantation.","东方晶源":"DJEL","测关键尺寸、做电子束检测，并用计算修正光刻图形":"Measures critical dimensions, performs electron-beam inspection and computationally corrects lithography patterns","CD-SEM、电子束检测与计算光刻":"CD-SEM, electron-beam inspection and computational lithography","兼有量检测与计算光刻，重点是看清、算准，而非曝光整片晶圆。":"Combines measurement, inspection and computation to improve accuracy; it does not expose an entire wafer.","睿励科学仪器":"RSIC","无损测量薄膜厚度、材料与结构参数":"Measures film thickness, materials and structural parameters without damaging the wafer","光学薄膜量测和工艺监控":"Optical thin-film metrology and process monitoring","偏光学量测，重点看薄膜，不等于缺陷扫描。":"Focuses on optical film measurement, which differs from scanning for defects.","埃芯半导体":"Eosemi","寻找晶圆结构和材料中的微小异常":"Finds small abnormalities in wafer structures and materials","光学 / X 射线量检测":"Optical / X-ray metrology and inspection","利用多种物理信号看缺陷和结构，技术路线区别于纯电子束。":"Uses several physical signals to study defects and structures, unlike a purely electron-beam approach.","御微半导体":"Yuwei","检查掩模版和晶圆表面的缺陷":"Inspects defects on photomasks and wafer surfaces","光学缺陷检测、图像与算法平台":"Optical defect inspection, imaging and algorithms","重点是大面积高速找缺陷，而非精确测量每条线宽。":"Focuses on finding defects quickly across large areas, rather than measuring every linewidth.","中科信":"CETC EME","把特定离子加速打入硅中，改变导电性质":"Accelerates selected ions into silicon to change its electrical properties","离子注入机、束流与剂量控制":"Ion implanters, beam control and dose control","属于掺杂工序，和光刻、检测完全不同。":"Serves the doping step, distinct from lithography and inspection.","晶亦精微":"Jingyi","把多层工艺后的晶圆表面磨到足够平":"Polishes processed wafers until their surfaces are sufficiently flat","CMP 设备、压力与均匀性控制":"CMP equipment, pressure control and uniformity","负责平坦化，为下一层光刻创造平整表面。":"Creates the flat surface needed for the next lithography layer.","悦芯科技":"TBT","晶圆或芯片完成后施加电信号判断好坏":"Applies electrical signals to finished wafers or chips to determine whether they work","自动测试设备 ATE 与测试算法":"Automated test equipment (ATE) and test algorithms","更靠近电性能测试环节，并非前道图形制造设备。":"Closer to electrical testing than to front-end pattern fabrication.","设备进入哪一道工序、是否不可替代":"Which process the tool serves and how essential it is","客户验收与重复订单":"Customer acceptance and repeat orders","吞吐量、精度、灵敏度和稳定性":"Throughput, precision, sensitivity and stability","装机量、备件服务和量产在线率":"Installed base, spare-parts service and production uptime","提供晶圆厂每天消耗的高纯原料":"Supply the high-purity materials that fabs consume every day","像烘焙的面粉、酵母和模具，但半导体材料的纯度、颗粒和批次一致性要求极端严格，一点污染就会毁掉整片晶圆。":"Like flour, yeast and molds in baking, but with exceptionally strict purity, particle and batch-consistency requirements. A tiny contaminant can ruin a wafer.","提供硅片、光刻胶、湿电子化学品、特种气体、前驱体和掩模版，在每一道工序里形成、去除或改变微观材料。":"Supply silicon wafers, photoresist, wet chemicals, specialty gases, precursors and masks to form, remove or change microscopic materials at each process step.","化工 / 硅基原料 + 高纯化和配方工艺":"Chemical / silicon feedstocks, purification and formulation processes","满足晶圆厂颗粒、金属杂质和一致性规格的电子级材料":"Electronic-grade materials meeting the fab's particle, metal-impurity and consistency specifications","原料提纯和配方合成":"Purify feedstocks and synthesize formulations","过滤、灌装与洁净运输":"Filter, fill and transport in clean conditions","在客户工艺线上小批验证":"Qualify small batches on the customer's process line","长期监控批次一致性后放量供货":"Monitor batch consistency over time before scaling supply","300mm 硅片":"300 mm silicon wafer","直径约 30 厘米的晶圆衬底；更大尺寸能一次制造更多裸片。":"A silicon substrate about 30 cm in diameter. Larger wafers can produce more dies in a single batch.","光刻胶":"Photoresist","遇光后溶解性质改变的感光材料，用来临时承载电路图形。":"A light-sensitive material whose solubility changes after exposure, temporarily carrying the circuit pattern.","湿电子化学品":"Wet electronic chemicals","用于清洗、显影和刻蚀的超高纯液体化学品。":"Ultra-high-purity liquid chemicals used for cleaning, developing and etching.","前驱体":"Precursor","薄膜沉积时进入反应腔、最终变成晶圆上薄膜的气态或液态原料。":"A gaseous or liquid feedstock introduced into a deposition chamber to form a film on the wafer.","实验室做出高纯样品只是第一步；真正壁垒是数年认证、每一批都稳定、供应连续，以及发现微量污染后的追溯能力。":"A pure laboratory sample is only the first step. The barriers are years of qualification, stable batches, continuous supply and tracing tiny contamination events.","同为‘材料公司’，上游多晶硅、成品硅片、光刻胶和气体的技术、设备与客户验证方法完全不同。":"Although all are materials companies, polysilicon, finished wafers, photoresist and gases have very different technologies, equipment and qualification methods.","中欣晶圆":"FT Wafer","制造可进入晶圆厂的 200 / 300mm 成品硅片":"Makes finished 200 / 300 mm silicon wafers ready for fabrication","拉晶、切片、研磨、抛光和缺陷控制":"Crystal growth, slicing, grinding, polishing and defect control","交付的是成品硅片，区别于只提供多晶硅原料。":"Delivers finished wafers, unlike a supplier that only provides polysilicon feedstock.","上海超硅":"AST","提供大尺寸硅片和相关硅材料":"Supplies large-diameter wafers and related silicon materials","晶体生长、300mm 硅片加工和质量控制":"Crystal growth, 300 mm wafer processing and quality control","与中欣属于相近赛道，竞争点在尺寸、规格、良率和量产能力。":"Operates in a similar segment to Zing, competing on dimensions, specifications, yield and production scale.","鑫华科技":"Xinhua Semiconductor","提供电子级多晶硅等更上游硅基原料":"Supplies electronic-grade polysilicon and other upstream silicon feedstocks","高纯化、杂质控制和稳定供料":"Purification, impurity control and reliable supply","是硅片厂的原料环节，不等于直接交付抛光晶圆。":"Provides feedstocks to wafer makers rather than directly delivering polished wafers.","徐州博康":"B&C Chemical","从单体、树脂、光酸延伸到 KrF / ArF 光刻胶":"Extends from monomers, resins and photoacid generators into KrF / ArF photoresists","分子合成、配方与曝光显影适配":"Molecular synthesis, formulation and matching exposure/development processes","强调光刻胶全链条和高端配方开发。":"Emphasizes an integrated photoresist chain and high-end formulation development.","科华微电子":"Kempur","提供多类半导体光刻胶产品":"Supplies several categories of semiconductor photoresist","胶体配方、纯化和客户工艺适配":"Formulation, purification and customer-process matching","属于光刻胶整胶产品平台；与原料单体企业不是同一环节。":"A formulated-photoresist platform, serving a different step from monomer feedstock suppliers.","联仕新材":"Lianshi","为清洗、显影、刻蚀提供湿电子化学品":"Supplies wet chemicals for cleaning, developing and etching","超高纯提纯、颗粒控制与洁净包装":"Ultra-high-purity purification, particle control and clean packaging","液态化学品赛道，核心指标是纯度和批次稳定。":"Competes in liquid chemicals, where purity and batch stability are key.","科利德":"Credit Chemical","提供电子特气与薄膜沉积前驱体":"Supplies specialty electronic gases and deposition precursors","高纯气体、前驱体合成和分析检测":"High-purity gases, precursor synthesis and analytical testing","聚焦反应性材料，技术重点不同于大宗供气。":"Focuses on reactive process materials rather than bulk gas supply.","久策气体":"Jiuce Gas","供应多类工业 / 电子气体及现场服务":"Supplies industrial / electronic gases and on-site services","气体纯化、储运、供气系统和安全管理":"Gas purification, storage and transport, delivery systems and safety management","更强调气体组合供应与现场保障。":"Emphasizes bundled gas supply and on-site continuity.","迪思微电子":"DS Photomask","制作承载芯片图形的高精度掩模版":"Makes high-precision masks that carry chip patterns","图形写入、缺陷控制和尺寸精度":"Pattern writing, defect control and dimensional precision","掩模版是光刻的‘底片’，不是消耗型液体或气体。":"The mask is lithography's master pattern rather than a liquid or gas consumable.","材料在客户工艺中的具体用途":"The material's exact role in the customer's process","纯度、颗粒和批次一致性":"Purity, particles and batch consistency","先进规格收入占比与认证进度":"Revenue from advanced specifications and qualification progress","产能利用率、良率和供货连续性":"Capacity utilization, yield and supply continuity","在晶圆上制造数十亿个存储单元":"Build billions of memory cells on a wafer","像把印刷、雕刻、镀膜和检查重复数百次，在硅片上搭出极小的开关、电容和金属线路；长鑫同时做产品设计与制造，因此叫 IDM。":"Repeated printing, etching, coating and checking builds tiny switches, capacitors and metal wires on silicon. CXMT both designs and manufactures products, making it an IDM.","DRAM 用一个晶体管控制一个微小电容：有无电荷代表 0 或 1。电容会漏电，因此芯片要周期刷新；读取时还要用灵敏放大器识别极微弱电荷。":"DRAM uses one transistor to control a tiny capacitor. Charge states represent 0 or 1. Capacitors leak, requiring refresh; sensitive amplifiers detect the weak signal during reads.","已完成设计的版图 + 裸硅片 + 设备、材料和工艺配方":"Completed layout, bare silicon wafers, equipment, materials and process recipes","包含大量存储裸片的成品晶圆，并通过晶圆测试标出好坏裸片":"Finished wafers containing many memory dies, with wafer testing identifying working and defective dies","制造晶体管、字线和位线":"Build transistors, wordlines and bitlines","制造高深宽比电容与绝缘结构":"Build high-aspect-ratio capacitors and insulating structures","逐层形成金属互连":"Form metal interconnections layer by layer","晶圆测试、良率分析并持续调工艺":"Test wafers, analyze yield and continuously tune processes","一个晶体管 Transistor + 一个电容 Capacitor 构成典型 DRAM 存储单元。":"One Transistor and one Capacitor (1T1C) form a typical DRAM memory cell.","字线 / 位线":"Wordline / bitline","字线选择一排单元，位线把某一列的微弱信号送到感测放大器。":"The wordline selects a row of cells; the bitline carries a column's weak signal to a sense amplifier.","良率":"Yield","一片晶圆上最终可用裸片的比例；它直接决定单位成本和交付能力。":"The proportion of usable dies on a wafer; it directly determines cost per chip and deliverable output.","制程节点":"Process node","一代工艺平台的名称，不等于芯片上所有结构都正好是该尺寸。":"The name of a process generation, rather than the exact size of every structure on the chip.","数百道工序相互耦合，结构微缩会同时挑战电容容量、漏电、噪声和良率；还需要巨额资本、长期工艺数据和规模化生产来摊薄成本。":"Hundreds of interdependent steps must work together. Shrinking structures challenges capacitance, leakage, noise and yield, and requires substantial investment, process data and production scale.","只有同做 DRAM 的企业才是长鑫最直接的产品竞争者。NAND、NOR、ReRAM、PCM 和存算一体使用不同单元、工艺与市场，不能混成一组排名。":"Other DRAM makers are CXMT's most direct product competitors. NAND, NOR, ReRAM, PCM and computing-in-memory use different cells, processes and markets, so a single ranking would mislead.","长鑫科技":"CXMT","设计并制造通用型 DRAM":"Designs and manufactures conventional DRAM","DDR4 / DDR5 与 LPDDR4X / 5 / 5X，IDM 模式":"DDR4 / DDR5 and LPDDR4X / LPDDR5 / LPDDR5X, using an IDM model","本图核心：主攻运行内存，产品直接面对全球 DRAM 厂商竞争。":"The core of this map: working memory competing directly with global DRAM suppliers.","福建晋华":"JHICC","DRAM 研发与制造":"DRAM development and manufacturing","DRAM 产品和晶圆制造能力":"DRAM products and wafer-fabrication capabilities","与长鑫同属境内 DRAM 制造方向，但公开量产和经营信息有限。":"Another mainland Chinese DRAM manufacturer, with limited public information on production and operations.","长江存储":"YMTC","制造 3D NAND Flash":"Manufactures 3D NAND Flash","多层堆叠 NAND 与 Xtacking 架构":"Stacked NAND and the Xtacking architecture","解决断电保存和大容量问题，不是 DRAM 直接同类产品。":"Addresses persistent, high-capacity storage rather than directly competing in DRAM products.","武汉新芯":"XMC","特色存储与晶圆代工 / 三维集成":"Specialty memory, wafer foundry services and 3D integration","NOR、特色工艺与 3D 集成":"NOR, specialty processes and 3D integration","偏特色工艺平台，不等于通用 DRAM IDM。":"A specialty-process platform rather than a conventional DRAM IDM.","芯天下":"XTX Technology","设计 NOR / SLC NAND 等非易失存储":"Designs non-volatile memory such as NOR and SLC NAND","Flash 芯片设计与产品定义":"Flash chip design and product specifications","Fabless 设计公司，不自建完整晶圆制造产线。":"A fabless designer that does not operate an entire wafer-fabrication line.","昕原半导体":"Xinyuan Semiconductor","探索阻变存储 ReRAM":"Develops resistive random-access memory (ReRAM)","以电阻状态表示 0 / 1 的新型存储":"Emerging memory representing bits through resistance states","物理机制不同，尚不能按 DDR 产品代际与 DRAM 比较。":"A different physical mechanism that cannot be compared with DRAM through DDR product generations.","时代全芯":"AMT","探索相变存储 PCM":"Develops phase-change memory (PCM)","利用材料晶态 / 非晶态差异存储数据":"Stores data using differences between crystalline and amorphous material states","属于新型非易失存储路线。":"An emerging non-volatile memory approach.","知存科技":"Witmem","把部分计算放进 Flash 存储阵列":"Performs some computation inside Flash memory arrays","存算一体芯片与算法映射":"Computing-in-memory chips and algorithm mapping","目标是减少数据搬运，商业问题不同于通用内存容量供给。":"Aims to reduce data movement, addressing a different commercial problem from conventional memory capacity.","产品代际与目标市场是否匹配":"Whether product generations match target markets","月产能、良率与单位晶圆可售 bit":"Monthly capacity, yield and saleable bits per wafer","DDR5 / LPDDR5 高端产品占比":"Share of advanced DDR5 / LPDDR5 products","平均售价、折旧、研发和现金流的周期承受力":"Resilience across price cycles: selling prices, depreciation, R&D and cash flow","把裸片接出来、保护起来并测合格":"Connect, protect and test bare dies","像把发动机装进车体并接好油路和电路：封装既要把微小电信号接到外部，也要散热、保护和保证长期可靠。":"Like installing an engine and connecting its systems: packaging connects tiny electrical signals to the outside, dissipates heat and ensures long-term reliability.","切割晶圆，挑出合格裸片，将裸片固定并用金线、凸点或硅通孔连接，再塑封和测试；先进封装还会把多颗不同芯片放在一个系统里。":"Dice wafers, select working dies, attach and connect them using wires, bumps or TSVs, then encapsulate and test them. Advanced packaging also integrates different chips into one system.","完成晶圆测试的晶圆 + 基板 / 引线框架 + 封装材料":"Tested wafers, substrates / leadframes and packaging materials","可焊到电路板、通过电性能与可靠性测试的封装芯片":"Packaged chips that can be soldered to boards and have passed electrical and reliability tests","晶圆减薄、切割与挑选":"Thin, dice and select wafers","固晶并做引线键合或倒装连接":"Attach dies and create wire-bond or flip-chip connections","塑封、植球和散热结构":"Encapsulate, form solder balls and add thermal structures","电性能、老化和可靠性测试":"Run electrical, burn-in and reliability tests","用极细金属线把裸片焊盘连到封装引脚。":"Connect die pads to package pins using very fine metal wires.","把裸片翻转，用大量微凸点直接连接基板，连接更短、密度更高。":"Flip the die and connect it directly to a substrate through many tiny bumps, shortening connections and increasing density.","穿过硅片的垂直导电孔，是 HBM 等三维堆叠的关键连接。":"Vertical conductive holes through silicon, essential for 3D stacks such as HBM.","用中介层并排或垂直堆叠多颗裸片，提高带宽和集成密度。":"Use an interposer to place dies side by side or stack them vertically, increasing bandwidth and integration density.","连接尺寸越来越小、密度越来越高，热、翘曲、信号和多裸片良率会同时恶化；量产窗口与客户可靠性认证是关键。":"Smaller, denser connections intensify heat, warpage, signal-integrity and multi-die yield challenges. Production process windows and customer reliability qualification are critical.","芯德半导体":"Chipde","提供凸块、晶圆级、倒装和 Chiplet 等先进封装服务":"Provides bumping, wafer-level, flip-chip and chiplet packaging services","Bumping、WLCSP、Flip Chip 与异构集成":"Bumping, wafer-level chip-scale packaging (WLCSP), flip chip and heterogeneous integration","更偏量产型先进封装平台与产能建设。":"Emphasizes volume-production advanced-packaging platforms and capacity expansion.","华进半导体":"NCAP","研发并产业化 2.5D / 3D、TSV 等封装技术":"Develops and commercializes 2.5D / 3D and TSV packaging technologies","中介层、TSV、Chiplet 集成与工艺平台":"Interposers, TSVs, chiplet integration and process platforms","更突出先进封装研发和公共技术平台属性。":"Emphasizes advanced-packaging research and shared technology-platform capabilities.","具体封装形态和客户产品":"Specific packaging formats and customer products","封装良率、热阻与可靠性":"Packaging yield, thermal resistance and reliability","量产产能、利用率和交付稳定性":"Production capacity, utilization and delivery stability","先进封装收入是否真正放量":"Whether advanced-packaging revenue is scaling","让 NAND 组成的 SSD 可靠、快速地工作":"Make a NAND-based SSD work reliably and quickly","SSD 主控像仓库调度员：知道数据放在哪里，坏掉的货架如何避开，怎样纠错，并把电脑指令翻译成 NAND 能执行的操作。":"An SSD controller is like a warehouse dispatcher: it tracks data locations, avoids damaged areas, corrects errors and translates computer commands into NAND operations.","运行 FTL 映射、ECC 纠错、磨损均衡、垃圾回收和接口协议。它主要管理 NAND，而不是控制长鑫 DRAM 存储单元。":"Runs the Flash Translation Layer (FTL), error correction (ECC), wear leveling, garbage collection and interface protocols. It mainly manages NAND rather than CXMT's DRAM cells.","主机读写命令 + 多颗 NAND 颗粒":"Host read/write commands and multiple NAND chips","对主机呈现为稳定、可寻址并符合 SATA / PCIe / NVMe 等协议的存储设备":"A stable, addressable storage device presented to the host through protocols such as SATA / PCIe / NVMe","接收主机协议命令":"Receive host protocol commands","用 FTL 映射逻辑地址与物理页":"Use the FTL to map logical addresses to physical pages","执行纠错、磨损均衡和垃圾回收":"Perform error correction, wear leveling and garbage collection","固件监控寿命、温度和异常掉电":"Use firmware to monitor endurance, temperature and unexpected power loss","把电脑看到的地址翻译成 NAND 中不断变化的真实位置。":"Translate the address seen by a computer into a physical NAND location that changes over time.","根据冗余信息发现并修正 NAND 读出的错误 bit。":"Use redundant information to detect and correct erroneous bits read from NAND.","磨损均衡":"Wear leveling","让不同存储块轮流使用，避免少数块过早耗尽寿命。":"Spread use across memory blocks so that a small group does not wear out prematurely.","面向高速非易失存储的主机通信协议，通常运行在 PCIe 上。":"A host communication protocol for fast non-volatile storage, usually operating over PCIe.","主控芯片、固件、算法和颗粒适配缺一不可；企业级产品还需要处理掉电、数据一致性、长时间高负载与多年客户认证。":"Controller chips, firmware, algorithms and NAND compatibility all matter. Enterprise products must also handle power loss, data consistency, prolonged high loads and years of customer qualification.","这是 NAND / SSD 的相邻产业链，不是长鑫 DRAM 的直接下游控制环节；网站保留它是为了说明完整存储系统。":"This is the adjacent NAND / SSD chain rather than a controller stage directly downstream of CXMT's DRAM. It is included to explain the complete storage system.","英韧科技":"InnoGrit","设计消费级到企业级 PCIe SSD 主控":"Designs consumer-to-enterprise PCIe SSD controllers","高速接口、ECC、固件与多类 NAND 适配":"High-speed interfaces, ECC, firmware and compatibility with multiple NAND types","产品覆盖较广，重点观察高端和企业级量产进展。":"Broad coverage; high-end and enterprise volume-production progress needs attention.","得一微":"Yeestor","面向嵌入式与消费电子提供存储控制方案":"Provides memory-control solutions for embedded and consumer electronics","eMMC、UFS、SSD 主控和固件":"eMMC, UFS, SSD controllers and firmware","嵌入式终端覆盖更突出，场景不只 PC SSD。":"Stronger embedded-device coverage, extending beyond PC SSDs.","忆芯科技":"StarBlaze","聚焦企业级和数据中心 SSD 主控":"Focuses on enterprise and data-center SSD controllers","PCIe / NVMe、高性能固件和数据保护":"PCIe / NVMe, high-performance firmware and data protection","更偏服务器级可靠性与高负载场景。":"Emphasizes server-grade reliability and sustained heavy workloads.","忆恒创源":"Memblaze","交付完整企业级 NVMe SSD 产品":"Delivers complete enterprise NVMe SSD products","主控、固件、硬件系统与企业服务":"Controllers, firmware, hardware systems and enterprise services","更接近整盘厂商，而不是只销售主控芯片。":"Closer to a finished-drive manufacturer than a controller-only supplier.","接口代际和真实性能曲线":"Interface generation and actual performance under load","兼容多少种 NAND 颗粒":"How many NAND types are supported","固件成熟度与异常场景处理":"Firmware maturity and handling of exceptional conditions","企业客户认证、批量出货与售后数据":"Enterprise qualification, volume shipments and after-sales data","把存储芯片组合成用户能买到的产品":"Assemble memory chips into products customers can buy","像整机装配厂：采购芯片颗粒，搭配 PCB、电源和固件，分选测试后做成内存条、SSD 或嵌入式存储。":"Like a final-assembly plant: source memory chips, add a printed circuit board (PCB), power circuitry and firmware, then test and sort them into modules, SSDs or embedded-storage products.","针对服务器、PC、工业设备等使用场景进行电路板设计、颗粒搭配、参数写入、烧机测试和整机认证，并通过品牌或 OEM 渠道销售。":"Design boards, select chips, configure parameters, burn-in test and qualify systems for servers, PCs or industrial equipment, then sell through brands or OEM channels.","DRAM / NAND 封装芯片 + PCB + 主控 / PMIC 等器件":"Packaged DRAM / NAND chips, PCBs and controllers / power-management ICs","DIMM、SODIMM、SSD、eMMC / UFS 等可直接集成的产品":"Ready-to-integrate DIMMs, SODIMMs, SSDs and eMMC / UFS products","选颗粒和电路方案":"Select memory chips and a circuit design","PCB 布线、贴片和参数配置":"Route the PCB, mount components and configure parameters","分选、烧机与兼容性测试":"Perform binning, burn-in and compatibility testing","客户认证、渠道销售与售后":"Qualify with customers, sell through channels and provide after-sales support","服务器 / 台式机和笔记本常见的两种 DRAM 内存条形态。":"Two common DRAM module formats used in servers / desktops and laptops.","内存条上记录容量、速度和时序等信息的小型配置数据。":"Small configuration records on a memory module containing capacity, speed and timing information.","电源管理芯片，DDR5 内存条常把部分电源管理放到模组上。":"A power-management integrated circuit (PMIC); DDR5 modules commonly place part of the power-management circuitry on the module.","按速度、功耗和稳定性把芯片颗粒分档，匹配不同产品。":"Sort chips by speed, power and stability to match different products.","模组并非简单贴片：高速布线、颗粒筛选、兼容性和批量一致性决定稳定性；商业壁垒还包括采购能力、客户认证、库存管理和渠道。":"Modules involve more than mounting chips. High-speed routing, binning, compatibility and batch consistency determine reliability; sourcing, qualification, inventory and channels add commercial barriers.","模组厂可能使用长鑫颗粒，但除非有客户或公司正式披露，‘产品兼容’不能直接写成‘已采购’。":"Module makers may use CXMT chips, but compatibility alone does not prove purchasing unless a customer or company formally discloses it.","记忆科技":"Ramaxel","为大型客户 son 1","先弄懂：存储芯片到底在存什么？":"What does a memory chip actually store?","不需要物理或电子基础。先认识 0 和 1、晶圆、芯片和内存条，再进入产业链。":"No physics or electronics background needed. Start with bits, wafers, chips and memory modules before exploring the industry chain.","建议阅读顺序：本节 → 产业图 → 环节技术课 → 公司":"Suggested order: this section → industry map → stage lessons → companies","DRAM 的最小存储单元":"The smallest DRAM memory cell","一个晶体管和一个电容构成 DRAM 存储单元示意":"Diagram of a DRAM cell consisting of one transistor and one capacitor","字线":"Wordline","晶体管":"Transistor","开关":"Switch","位线":"Bitline","电容":"Capacitor","电荷":"Charge","晶体管像门，控制是否读取电容；电容里有没有足够电荷，用来表示一个 bit 的 0 或 1。":"The transistor acts like a gate controlling access to the capacitor. Whether sufficient charge is present represents a bit's 0 or 1.","先记住 3 句话":"Remember three points","长鑫制造的 DRAM，是设备工作时的“临时工作台”":"CXMT's DRAM is a device's temporary workspace","bit 是最小单位。":"A bit is the smallest unit.","它只有 0 或 1；数十亿个 bit 组合起来，才能保存文字、图片和程序运行数据。":"It is either 0 or 1. Billions of bits together represent text, images and data used by running programs.","DRAM 要不断刷新。":"DRAM needs regular refreshing.","微小电容会漏电，芯片必须周期性读取并补回电荷；所以 DRAM 断电后数据会消失。":"Tiny capacitors leak. The chip periodically reads and restores their charge, so DRAM loses data when power is removed.","存储和计算是两件事。":"Storage and computation are different jobs.","CPU / GPU 负责计算和判断，DRAM 负责暂存正在使用的数据；两者之间搬数据的速度会影响整机性能。":"CPUs / GPUs calculate and make decisions; DRAM temporarily holds the data in use. Transfer speed between them affects overall performance.","最常见误区":"A common misunderstanding","手机的“12GB 运行内存”主要是 DRAM；“512GB 存储空间”主要是 NAND Flash。名称都带存储，但工作原理和产业链不同。":"A phone's 12 GB of working memory is mainly DRAM; its 512 GB of storage is mainly NAND Flash. Both store data, but their mechanisms and industry chains differ.","零基础第 2 课":"Beginner lesson 2","从一张圆片到一根内存条":"From a circular wafer to a memory module","四个词经常被混用，先把实物层级分清楚。":"These four terms are often confused. First distinguish the physical product <script>
(function () {
  "use strict";
  const dictionary = window.__CXMT_TRANSLATIONS.dictionary;
  const pairs = window.__CXMT_TRANSLATIONS.pairs;
  let orderedKeys = Object.keys(dictionary).sort((a,b) => b.length-a.length);
  let data = window.__CXMT_EMBEDDED_MARKET;
  let loadState = "snapshot", inFlight = null;
  window.__CXMT_DATA_VERSION = 0;
  window.__CXMT_TRANSLATION_MISSING = new Set();
  const hasHan = s => /[\u3400-\u9fff]/u.test(s);
  const isPair = p => p && typeof p.en === "string" && typeof p.zh === "string";
  function translate(value) {
    if (isPair(value)) return value;
    const text = String(value ?? ""), trimmed = text.trim();
    if (pairs[text] || pairs[trimmed]) { const p = pairs[text] || pairs[trimmed]; return {en:p[0],zh:p[1]}; }
    if (dictionary[text] || dictionary[trimmed]) return {en:dictionary[text] || dictionary[trimmed],zh:text};
    if (!hasHan(text)) return null;
    const count = trimmed.match(/^(\d+)\s*家未上市\s*·\s*(\d+)\s*家\s*IPO\s*进程$/u);
    if (count) return {en:count[1]+" unlisted · "+count[2]+" in IPO process",zh:text};
    const stage = trimmed.match(/^第\s*(\d+)\s*环[：:]\s*(.*)$/u);
    if (stage) return {en:"Stage "+stage[1]+": "+(translate(stage[2])?.en || stage[2]),zh:text};
    let en = text;
    for (const key of orderedKeys) if (en.includes(key)) en=en.split(key).join(dictionary[key]);
    en=en.replace(/(\d+)\s*家/g,"$1 companies").replace(/第\s*(\d+)/g,"Stage $1").replace(/环[：:]/g,":");
    if (hasHan(en)) {
      window.__CXMT_TRANSLATION_MISSING.add(text);
      console.warn("Untranslated content:", text);
      return {en:"English translation pending",zh:text};
    }
    return {en:en.trim(),zh:text};
  }
  window.__CXMT_ENGLISH = s => translate(s)?.en || String(s ?? "");
  function safeUrl(url) {
    try { const u=new URL(url); return u.protocol==="https:" || u.protocol==="http:" ? u.href : "#"; } catch { return "#"; }
  }
  function validData(next) {
    return next && next.schemaVersion===1 && Array.isArray(next.metrics) && Array.isArray(next.news) && Array.isArray(next.sources) && typeof next.lastCheckedAt==="string";
  }
  function addTranslations(next) {
    for (const update of next.companyUpdates || []) {
      for (const value of Object.values(update.fields || {})) if (isPair(value)) dictionary[value.zh]=value.en;
    }
    if (next.cxmt) for (const value of Object.values(next.cxmt)) if (isPair(value)) dictionary[value.zh]=value.en;
    orderedKeys=Object.keys(dictionary).sort((a,b)=>b.length-a.length);
  }
  async function refresh() {
    if (inFlight) return inFlight;
    if (location.protocol==="file:") {loadState="offline";return data;}
    inFlight=(async()=>{
      try {
        const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),8000);
        let response;
        try { response=await fetch(new URL("data/market.json?t="+Date.now(),document.baseURI),{cache:"no-store",signal:controller.signal}); }
        finally { clearTimeout(timeout); }
        if (!response.ok) throw new Error("HTTP "+response.status);
        const next=await response.json();
        if (!validData(next)) throw new Error("Invalid data schema");
        data=next; addTranslations(data); loadState="loaded";
      } catch(error) { loadState="unavailable"; console.warn("Keeping last verified snapshot:",error.message); }
      window.__CXMT_CURRENT_MARKET=data;
      window.dispatchEvent(new CustomEvent("cxmt-market-update",{detail:{data,loadState}}));
      return data;
    })().finally(()=>{inFlight=null;});
    return inFlight;
  }
  window.__CXMT_REFRESH=refresh;
  window.__CXMT_CURRENT_MARKET=data;
  window.__CXMT_READY=refresh();
  setInterval(()=>{if(!document.hidden) refresh();},5*60*1000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden) refresh();});

  window.__CXMT_INSTALL = function(jsxRuntime, React, context) {
    const raw=jsxRuntime.jsx, rawMany=jsxRuntime.jsxs;
    const baseCompanies=context.companies.map(c=>({...c}));
    const dramCompetitors=context.competitors?.find(c=>c.segment==="DRAM 制造");
    const baseDramCompetitors=dramCompetitors?{...dramCompetitors}:null;
    function Bi({value}) {
      const p=translate(value);
      if (!p) return value;
      return rawMany("span",{className:"bi",children:[
        raw("span",{className:"bi-en",lang:"en",children:p.en}),
        raw("span",{className:"bi-zh",lang:"zh-CN",children:p.zh})
      ]});
    }
    const bi=value=>raw(Bi,{value});
    const pair=(en,zh)=>bi({en,zh});
    function mapChildren(children, parentType) {
      if (!Array.isArray(children)) {
        return typeof children==="string" && (hasHan(children)||pairs[children]) ? bi(children) : children;
      }
      const output=[]; let run=[];
      function flush() {
        if (!run.length) return;
        if (run.some(v=>typeof v==="string"&&(hasHan(v)||pairs[v]))) output.push(bi(run.join("")));
        else output.push(...run);
        run=[];
      }
      for(const child of children) {
        if(typeof child==="string" || typeof child==="number") run.push(child);
        else {flush();output.push(child);}
      }
      flush(); return output;
    }
    function Select(props) {
      const [open,setOpen]=React.useState(false), [active,setActive]=React.useState(0), ref=React.useRef(null), id=React.useId();
      let options=React.Children.toArray(props.children).filter(o=>React.isValidElement(o)).map(o=>({value:o.props.value,label:o.props.children}));
      if(props["aria-label"]==="公司状态") {
        const present=new Set(options.map(o=>o.value));
        for(const c of context.companies) if(!present.has(c.status)) {options.push({value:c.status,label:c.status});present.add(c.status);}
      }
      const selected=options.find(o=>o.value===props.value)||options[0];
      React.useEffect(()=>{
        const close=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
        document.addEventListener("pointerdown",close);
        return ()=>document.removeEventListener("pointerdown",close);
      },[]);
      function choose(index) {
        const option=options[index]; if(!option)return;
        props.onChange?.({target:{value:option.value}});
        setOpen(false);
        ref.current?.querySelector(".bi-select-trigger")?.focus();
      }
      function keyDown(e) {
        if(["ArrowDown","ArrowUp","Home","End","Enter"," ","Escape"].includes(e.key)) e.preventDefault();
        if(e.key==="Escape"){setOpen(false);return;}
        if(e.key==="Enter"||e.key===" "){if(open)choose(active);else{setActive(Math.max(0,options.indexOf(selected)));setOpen(true);}return;}
        if(e.key==="ArrowDown"||e.key==="ArrowUp") {
          if(!open){setOpen(true);setActive(Math.max(0,options.indexOf(selected)));}
          else setActive(a=>(a+(e.key==="ArrowDown"?1:-1)+options.length)%options.length);
        }
        if(e.key==="Home")setActive(0);if(e.key==="End")setActive(options.length-1);
      }
      const label=translate(props["aria-label"]);
      return rawMany("div",{className:"bi-select",ref,onKeyDown:keyDown,children:[
        rawMany("button",{type:"button",className:"bi-select-trigger",role:"combobox","aria-label":label?label.en+" / "+label.zh:props["aria-label"],"aria-expanded":open,"aria-controls":id,"aria-activedescendant":open?id+"-"+active:undefined,onClick:()=>{setActive(Math.max(0,options.indexOf(selected)));setOpen(!open);},children:[bi(selected?.label||""),raw("span",{"aria-hidden":true,children:"⌄"})]}),
